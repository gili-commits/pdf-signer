<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חתימה דיגיטלית — דשבורד</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
    header {
      background: #2563eb; color: #fff; padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 22px; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #6b7280; color: #fff; }
    .btn-secondary:hover { background: #4b5563; }

    /* התחברות */
    #login-section {
      max-width: 400px; margin: 80px auto; background: #fff;
      padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    #login-section h2 { margin-bottom: 20px; text-align: center; }
    #login-section input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
    }
    #login-section .btn { width: 100%; }
    .error-msg { color: #dc2626; font-size: 13px; margin-bottom: 8px; }

    /* דשבורד */
    #dashboard-section { display: none; max-width: 800px; margin: 32px auto; padding: 0 16px; }
    .upload-area {
      background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;
    }
    .upload-area input[type="file"] { margin-bottom: 12px; }
    .doc-list { list-style: none; }
    .doc-item {
      background: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .doc-info { flex: 1; }
    .doc-info h3 { font-size: 16px; margin-bottom: 4px; }
    .doc-info span { font-size: 13px; color: #6b7280; }
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: bold; margin-right: 8px;
    }
    .status-draft { background: #fef3c7; color: #92400e; }
    .status-sent { background: #dbeafe; color: #1e40af; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .doc-actions { display: flex; gap: 8px; }
    .doc-actions .btn { padding: 6px 14px; font-size: 13px; }
    .empty-state { text-align: center; color: #9ca3af; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>חתימה דיגיטלית</h1>
    <div id="header-user" style="display:none;">
      <span id="user-email" style="margin-left:12px;"></span>
      <button class="btn btn-secondary" onclick="logout()">התנתק</button>
    </div>
  </header>

  <!-- מסך התחברות -->
  <div id="login-section">
    <h2>התחברות</h2>
    <div id="login-error" class="error-msg" style="display:none;"></div>
    <input type="email" id="login-email" placeholder="אימייל" />
    <input type="password" id="login-password" placeholder="סיסמה" />
    <button class="btn btn-primary" onclick="login()">התחבר</button>
  </div>

  <!-- דשבורד -->
  <div id="dashboard-section">
    <div class="upload-area">
      <h2>העלאת מסמך חדש</h2>
      <p style="margin:8px 0 16px; color:#6b7280;">בחר קובץ PDF, או כמה תמונות (JPG/PNG) שיאוחדו ל-PDF אחד — עמוד לכל תמונה</p>
      <input type="file" id="pdf-file" accept=".pdf,.jpg,.jpeg,.png" multiple onchange="onFilesSelected()" />

      <div id="image-options" style="display:none; margin-top:16px;">
        <label style="display:inline-flex; align-items:center; gap:6px; font-size:14px; color:#374151; cursor:pointer;">
          <input type="checkbox" id="enhance-toggle" checked onchange="renderImageList()" />
          שפר לתצוגת מסמך (רקע לבן וברור)
        </label>
        <p style="font-size:12px; color:#9ca3af; margin:6px 0 12px;">גרור את הסדר עם החיצים — כך ייקבע מי עמוד 1, 2 וכו'</p>
        <div id="image-list" style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;"></div>
      </div>

      <br />
      <button class="btn btn-primary" onclick="uploadPdf()">העלה מסמך</button>
    </div>

    <h2 style="margin-bottom:16px;">המסמכים שלי</h2>
    <ul class="doc-list" id="doc-list">
      <li class="empty-state">טוען מסמכים...</li>
    </ul>
  </div>

  <script>
    // בדיקת חיבור בטעינה
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const user = await res.json();
          showDashboard(user.email);
        }
      } catch (e) { /* לא מחובר */ }
    }

    function showDashboard(email) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';
      document.getElementById('header-user').style.display = 'flex';
      document.getElementById('user-email').textContent = email;
      loadDocuments();
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (res.ok) {
        showDashboard(data.email);
      } else {
        errorEl.textContent = data.error;
        errorEl.style.display = 'block';
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }

    // === בחירת קבצים: אם תמונות — הצג רשימה לסידור ושיפור ===
    let selectedImages = []; // [{file, dataUrl}]

    function onFilesSelected() {
      const files = [...document.getElementById('pdf-file').files];
      const optionsEl = document.getElementById('image-options');
      const images = files.filter(f => f.type === 'image/jpeg' || f.type === 'image/png');

      // אם אין תמונות (PDF או כלום) — אין מה לסדר
      if (images.length === 0) {
        selectedImages = [];
        optionsEl.style.display = 'none';
        return;
      }

      selectedImages = [];
      let loaded = 0;
      images.forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          selectedImages[i] = { file, dataUrl: e.target.result };
          loaded++;
          if (loaded === images.length) {
            optionsEl.style.display = 'block';
            renderImageList();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    let justMovedIdx = null; // הכרטיס שזז לאחרונה — יודגש

    function renderImageList() {
      const list = document.getElementById('image-list');
      const enhance = document.getElementById('enhance-toggle').checked;
      list.innerHTML = '';

      selectedImages.forEach((item, idx) => {
        const card = document.createElement('div');
        const highlighted = idx === justMovedIdx;
        card.style.cssText =
          'position:relative; border:2px solid ' + (highlighted ? '#2563eb' : '#d1d5db') +
          '; border-radius:10px; padding:10px; width:230px; background:#fff;' +
          ' box-shadow:' + (highlighted ? '0 0 0 3px rgba(37,99,235,0.25)' : '0 1px 4px rgba(0,0,0,0.08)') +
          '; transition:border-color .3s, box-shadow .3s;';

        // תג מספר עמוד בפינה
        const badge = document.createElement('div');
        badge.textContent = idx + 1;
        badge.style.cssText = 'position:absolute; top:-12px; right:-12px; width:32px; height:32px; border-radius:50%;' +
          ' background:#2563eb; color:#fff; font-weight:bold; font-size:16px; display:flex; align-items:center;' +
          ' justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.2);';

        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'width:100%; height:290px; object-fit:contain; background:#fff; border:1px solid #f0f0f0; border-radius:4px;';
        renderThumb(canvas, item.dataUrl, enhance);

        const controls = document.createElement('div');
        controls.style.cssText = 'display:flex; justify-content:center; align-items:center; gap:8px; margin-top:10px;';
        const label = document.createElement('span');
        label.textContent = 'עמוד:';
        label.style.cssText = 'font-size:14px; color:#374151; font-weight:bold;';
        const select = document.createElement('select');
        select.style.cssText = 'padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; cursor:pointer;';
        for (let n = 1; n <= selectedImages.length; n++) {
          const opt = document.createElement('option');
          opt.value = n; opt.textContent = n;
          if (n === idx + 1) opt.selected = true;
          select.appendChild(opt);
        }
        select.onchange = () => moveImageTo(idx, parseInt(select.value) - 1);
        controls.appendChild(label);
        controls.appendChild(select);

        card.appendChild(badge);
        card.appendChild(canvas);
        card.appendChild(controls);
        list.appendChild(card);
      });

      // הסר את ההדגשה אחרי רגע
      if (justMovedIdx !== null) {
        const moved = justMovedIdx;
        setTimeout(() => { if (justMovedIdx === moved) { justMovedIdx = null; renderImageList(); } }, 700);
      }
    }

    // הזז כרטיס מ-idx למיקום target, והשאר מסתדרים אוטומטית
    function moveImageTo(idx, target) {
      if (target < 0 || target >= selectedImages.length || target === idx) return;
      const [item] = selectedImages.splice(idx, 1);
      selectedImages.splice(target, 0, item);
      justMovedIdx = target; // הדגש את הכרטיס במיקומו החדש
      renderImageList();
    }

    // ציור תמונה על canvas — עם או בלי שיפור למסמך
    function renderThumb(canvas, dataUrl, enhance) {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        if (enhance) applyDocumentFilter(ctx, canvas.width, canvas.height);
      };
      img.src = dataUrl;
    }

    // סינון "מסמך": גווני אפור + מתיחת ניגודיות + הלבנת רקע
    function applyDocumentFilter(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // חשב היסטוגרמה של בהירות לקביעת סף רקע
      let max = 0;
      const lum = new Float32Array(d.length / 4);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        lum[j] = l;
        if (l > max) max = l;
      }
      // נרמל כך שהרקע (הבהיר ביותר) יהפוך ללבן, והדיו יישאר כהה
      const white = Math.max(max * 0.92, 160);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        let v = lum[j] / white * 255;
        // עקומת ניגודיות — מבהיר רקע, מכהה טקסט
        v = v < 128 ? Math.pow(v / 128, 1.6) * 128 : 255 - Math.pow((255 - v) / 127, 1.6) * 127;
        v = Math.max(0, Math.min(255, v));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // המרת canvas ל-Blob לצורך שליחה
    function canvasToBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
    }

    async function uploadPdf() {
      const fileInput = document.getElementById('pdf-file');
      if (!fileInput.files.length) return alert('יש לבחור קובץ PDF או תמונות');

      const formData = new FormData();

      if (selectedImages.length > 0) {
        // תמונות — עבד ושלח לפי הסדר שנקבע
        const enhance = document.getElementById('enhance-toggle').checked;
        for (const item of selectedImages) {
          const blob = await processImage(item.dataUrl, enhance);
          const name = item.file.name.replace(/\.(jpe?g|png)$/i, '') + '.jpg';
          formData.append('pdf', blob, name);
        }
      } else {
        // PDF רגיל
        for (const file of fileInput.files) {
          formData.append('pdf', file);
        }
      }

      const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (res.ok) {
        window.location.href = `/editor?doc=${data.documentId}`;
      } else {
        alert(data.error);
      }
    }

    // מעבד תמונה בודדת ומחזיר Blob (JPG)
    function processImage(dataUrl, enhance) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          if (enhance) applyDocumentFilter(ctx, canvas.width, canvas.height);
          resolve(await canvasToBlob(canvas));
        };
        img.src = dataUrl;
      });
    }

    async function loadDocuments() {
      const res = await fetch('/api/documents');
      const docs = await res.json();
      const list = document.getElementById('doc-list');

      if (!docs.length) {
        list.innerHTML = '<li class="empty-state">אין מסמכים עדיין. העלה את המסמך הראשון!</li>';
        return;
      }

      list.innerHTML = docs.map(doc => `
        <li class="doc-item">
          <div class="doc-info">
            <h3>${doc.filename}</h3>
            <span class="status-badge status-${doc.status}">${statusLabel(doc.status)}</span>
            <span>${new Date(doc.created_at).toLocaleDateString('he-IL')}</span>
          </div>
          <div class="doc-actions">
            <button class="btn btn-primary" onclick="location.href='/editor?doc=${doc.id}'">עריכה</button>
            <button class="btn btn-danger" onclick="deleteDoc('${doc.id}')">מחיקה</button>
          </div>
        </li>
      `).join('');
    }

    function statusLabel(status) {
      const labels = { draft: 'טיוטה', sent: 'נשלח', completed: 'נחתם' };
      return labels[status] || status;
    }

    async function deleteDoc(id) {
      if (!confirm('למחוק את המסמך?')) return;
      const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
      if (res.ok) loadDocuments();
      else alert('שגיאה במחיקה');
    }

    // Enter לשליחת login
    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    checkAuth();
  </script>
</body>
</html>
