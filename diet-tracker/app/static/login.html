<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>התחברות · מעקב משקל</title>
</head>
<body class="login-body">
  <main class="login">
    <img src="/static/icons/icon-192.png" alt="" width="80" height="80">
    <h1>מעקב משקל ותזונה</h1>
    <form id="login-form" class="card">
      <label for="password">סיסמה</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary big">כניסה</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
